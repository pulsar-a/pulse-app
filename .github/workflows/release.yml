# Publishes a release when a version tag is pushed (step 14). `make release` makes the tag, with its CHANGELOG.md
# entry, and pushes it; a tag pushed by hand works too (its notes then just point at the commits).
# Builds and tests, packages with Velopack (installer, update packages, portable zip), and creates the GitHub
# Release that installed copies update from. A tag with a suffix (v0.2.0-beta.1) makes a pre-release, which only
# copies with "Betas too" chosen in Settings → About pick up; everyone else gets stable releases only.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer reads the version from the tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          if ($version.Contains('-')) { "PRERELEASE=--pre" >> $env:GITHUB_ENV }

      - name: Test
        run: dotnet test tests/Pulse.Tests/Pulse.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/Pulse/Pulse.csproj -c Release -r win-x64 --self-contained false
          -p:PublishReadyToRun=true -o artifacts/publish

      # vpk and Versionize, at the versions pinned in dotnet-tools.json.
      - name: Tools
        run: dotnet tool restore

      # This version's section of CHANGELOG.md (written by `make release`), as the release notes.
      - name: Release notes
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md -ErrorAction SilentlyContinue
          $start = [array]::IndexOf($lines, "<a name=""$env:VERSION""></a>")
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^<a name='; $i++) { $notes += $lines[$i] }
            $notes = $notes | Select-Object -Skip 1   # the "## [version](compare link) (date)" heading: the release has a title
          }
          if (-not ($notes -join '').Trim()) {
            $notes = @("See the [commits in this release](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }}).")
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ($notes -join "`n").Trim() | Set-Content artifacts/release-notes.md -Encoding utf8
          Get-Content artifacts/release-notes.md

      # The previous release, so this one can ship small delta updates. The very first release has none.
      # A beta is built against the latest pre-release (--pre), which beta copies are running; without it the
      # download looks only at stable releases, and betas shipped full packages only.
      - name: Previous release
        continue-on-error: true
        run: >
          dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} ${{ env.PRERELEASE }} -o artifacts/releases

      # PulseApp, not Pulse: Velopack installs to %LOCALAPPDATA%\<packId>, and Pulse's settings and history live in
      # %LOCALAPPDATA%\Pulse, which uninstalling would otherwise delete. Signing is added here later (step 14).
      - name: Package
        run: >
          dotnet vpk pack --packId PulseApp --packVersion ${{ env.VERSION }} --packDir artifacts/publish
          --mainExe Pulse.exe --packTitle Pulse --icon src/Pulse/Resources/Pulse.ico
          --framework net10-x64-desktop --releaseNotes artifacts/release-notes.md -o artifacts/releases

      - name: Create the GitHub Release
        run: >
          dotnet vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish ${{ env.PRERELEASE }}
          --releaseName "Pulse ${{ env.VERSION }}" --tag ${{ github.ref_name }} -o artifacts/releases
