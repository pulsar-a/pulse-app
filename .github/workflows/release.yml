# Publishes a release when a version tag is pushed (step 14): `git tag v0.2.0 && git push origin v0.2.0`.
# Builds and tests, packages with Velopack (installer, update packages, portable zip), and creates the GitHub
# Release that installed copies update from. A tag with a suffix (v0.2.0-beta.1) makes a pre-release, which only
# copies on the beta channel pick up (betas by default, or anyone who chose "Betas too" in Settings → About).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload its files

concurrency:
  group: release
  cancel-in-progress: false

env:
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer reads the version from the tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          if ($version.Contains('-')) { "PRERELEASE=--pre" >> $env:GITHUB_ENV }

      - name: Test
        run: dotnet test tests/Pulse.Tests/Pulse.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish src/Pulse/Pulse.csproj -c Release -r win-x64 --self-contained false
          -p:PublishReadyToRun=true -o artifacts/publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # The previous release, so this one can ship small delta updates. The very first release has none.
      - name: Previous release
        continue-on-error: true
        run: >
          vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} -o artifacts/releases

      # PulseApp, not Pulse: Velopack installs to %LOCALAPPDATA%\<packId>, and Pulse's settings and history live in
      # %LOCALAPPDATA%\Pulse, which uninstalling would otherwise delete. Signing is added here later (step 14).
      - name: Package
        run: >
          vpk pack --packId PulseApp --packVersion ${{ env.VERSION }} --packDir artifacts/publish
          --mainExe Pulse.exe --packTitle Pulse --icon src/Pulse/Resources/Pulse.ico
          --framework net10-x64-desktop -o artifacts/releases

      - name: Create the GitHub Release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish ${{ env.PRERELEASE }}
          --releaseName "Pulse ${{ env.VERSION }}" --tag ${{ github.ref_name }} -o artifacts/releases
