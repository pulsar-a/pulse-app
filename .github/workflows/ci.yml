# Build and test on every push to main and every pull request (step 14).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # WPF, LibreHardwareMonitor and the Windows APIs Pulse uses (HID, PDH, http.sys) need Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the latest v* tag (MinVer), which needs the history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Pulse.slnx

      - name: Build
        run: dotnet build Pulse.slnx -c Release --no-restore

      # Hardware-dependent tests cope with a runner: no GPU counters, no USB coolers, and the admin snapshot
      # test skips itself without its fixture.
      - name: Test
        run: >
          dotnet test tests/Pulse.Tests/Pulse.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
